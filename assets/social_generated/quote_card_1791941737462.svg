<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="40%" stop-color="#140a2b" />
      <stop offset="100%" stop-color="#05020c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Purple Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Ambient Glow Elements -->
  <circle cx="900" cy="150" r="220" fill="#7C3AED" opacity="0.25" filter="url(#glow)" />
  <circle cx="150" cy="950" r="280" fill="#D97706" opacity="0.18" filter="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1000" height="1000" rx="32" fill="none" stroke="#2D1B4E" stroke-width="2" opacity="0.6" />

  <!-- Top Header Badge -->
  <g transform="translate(100, 110)">
    <rect width="260" height="48" rx="24" fill="#1E1035" stroke="#7C3AED" stroke-width="1.5" />
    <circle cx="28" cy="24" r="8" fill="#F59E0B" />
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" letter-spacing="2">DIASPORA NEARBY</text>
  </g>

  <!-- Network Pill: Built on Base -->
  <g transform="translate(800, 110)">
    <rect width="180" height="48" rx="24" fill="#0052FF" opacity="0.15" stroke="#0052FF" stroke-width="1.5" />
    <circle cx="28" cy="24" r="8" fill="#0052FF" />
    <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#60A5FA" letter-spacing="1">ON BASE L2</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="1">
    Never Walk A Foreign City Alone Again
  </text>

  <!-- Quote Mark Icon -->
  <text x="100" y="420" font-family="Georgia, serif" font-size="120" fill="#7C3AED" opacity="0.5">“</text>

  <!-- Body Quote (Multi-line) -->
  <foreignObject x="100" y="440" width="880" height="340">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 38px; line-height: 1.45; color: #F8FAFC; font-weight: 500;">
      When proximity alerts meet on-chain trust on Base, borders dissolve and your homeland walks right beside you.
    </div>
  </foreignObject>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="840" x2="980" y2="840" stroke="#2D1B4E" stroke-width="2" />

  <!-- Author Signature & Title -->
  <g transform="translate(100, 890)">
    <circle cx="36" cy="36" r="36" fill="#F59E0B" opacity="0.2" />
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle">PS</text>
    <text x="96" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Peter Swai</text>
    <text x="96" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Peter Swai • Architect of the Global Diaspora Sovereign Economy</text>
  </g>

  <!-- Web & App Callout Bottom Right -->
  <g transform="translate(730, 905)">
    <text x="250" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="end">diasporanearby.com</text>
    <text x="250" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="end">iOS • Android • Base L2</text>
  </g>
</svg>