name: CI

on:
  push:
    branches: [dev, staging, production, main]
  pull_request:
    branches: [dev, staging, production, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check repository hygiene
        run: node scripts/check-repo-hygiene.js

      - name: Validate Firebase index configuration
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"

      - name: Install admin-tool dependencies
        working-directory: tools/admin-scripts
        run: npm ci

      - name: Audit admin-tool dependencies
        working-directory: tools/admin-scripts
        run: npm audit --audit-level=high

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test scripts

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release web app
        run: flutter build web --release

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Load Functions entry point
        run: node -e "require('./index.js')"

      - name: Audit callable security controls
        continue-on-error: true
        run: npm run audit:callables

      - name: Audit dependencies
        run: npm audit --audit-level=high

  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-rules-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-rules-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test rules
        run: npm test

      - name: Audit rules tooling
        run: npm audit --audit-level=high

  blockchain:
    name: Blockchain Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
