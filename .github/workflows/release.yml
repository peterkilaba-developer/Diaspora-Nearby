name: Release & CD

on:
  push:
    branches: [production]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play release track (beta = Open Testing, alpha = Closed Testing, internal, production)"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - alpha
          - internal
          - production
      deploy_firebase:
        description: "Deploy Firebase Functions, Firestore Rules, and Storage Rules"
        required: false
        default: true
        type: boolean
      publish_play_store:
        description: "Upload signed AAB to Google Play Console"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check repository hygiene
        run: node scripts/check-repo-hygiene.js

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze & Test Flutter
        run: |
          flutter analyze
          flutter test

      - name: Lint & Verify Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run lint
          node -e "require('./index.js')"

  deploy-firebase:
    name: Deploy Firebase Backend & Rules
    needs: quality-gates
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_firebase == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate & Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set; skipping Firebase deploy."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/firebase-sa.json"
          firebase target:apply hosting landing diaspora-nearby-a3dac || true
          firebase deploy --project diaspora-nearby-a3dac --only firestore:rules,storage,functions,hosting:landing --non-interactive --force
          rm -f /tmp/firebase-sa.json

  build-and-release-android:
    name: Build & Publish Signed Android Release
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free up runner disk space & configure swap
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/rust
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/ghcup
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/29*
          sudo docker image prune --all --force || true
          sudo fallocate -l 2G /swapfile_ci || sudo dd if=/dev/zero of=/swapfile_ci bs=1M count=2048
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Restore Android Keystore & Signing Properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/DiasporaNearby_release-keystore.jks
          cat << EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=DiasporaNearby_release-keystore.jks
          EOF

      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING }}
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          mkdir -p android/app/src/production android/app/src/staging android/app/src/dev
          echo "$GOOGLE_SERVICES_JSON_PROD" > android/app/google-services.json
          echo "$GOOGLE_SERVICES_JSON_PROD" > android/app/src/production/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON_STAGING" ]; then
            echo "$GOOGLE_SERVICES_JSON_STAGING" > android/app/src/staging/google-services.json
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_DEV" ]; then
            echo "$GOOGLE_SERVICES_JSON_DEV" > android/app/src/dev/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Signed Production App Bundle (.aab) & APK (.apk)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          BUILD_NUMBER=$((25 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Building version code: $BUILD_NUMBER"
          flutter build appbundle --release \
            --flavor production \
            -t lib/main_production.dart \
            --target-platform android-arm,android-arm64 \
            --build-name=1.2.7 \
            --build-number=$BUILD_NUMBER \
            --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          flutter build apk --release \
            --flavor production \
            -t lib/main_production.dart \
            --target-platform android-arm,android-arm64 \
            --build-name=1.2.7 \
            --build-number=$BUILD_NUMBER \
            --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          df -h

      - name: Upload Release Artifacts (.aab & .apk)
        uses: actions/upload-artifact@v4
        with:
          name: android-production-release-${{ github.sha }}
          path: |
            build/app/outputs/bundle/productionRelease/app-production-release.aab
            build/app/outputs/flutter-apk/app-production-release.apk
          retention-days: 30

      - name: Publish Signed APK & AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.2.7-build.${{ env.BUILD_NUMBER }}"
          gh release create "$TAG_NAME" \
            build/app/outputs/flutter-apk/app-production-release.apk \
            build/app/outputs/bundle/productionRelease/app-production-release.aab \
            --title "Diaspora Nearby v1.2.7 (Build ${{ env.BUILD_NUMBER }})" \
            --notes "Automated production release (Build ${{ env.BUILD_NUMBER }}, commit ${{ github.sha }})." \
            --latest || true
          gh release upload latest \
            build/app/outputs/flutter-apk/app-production-release.apk \
            build/app/outputs/bundle/productionRelease/app-production-release.aab \
            --clobber || true

      - name: Publish to Google Play Console (Open Testing / Beta Track)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_play_store == true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.diasporanearby.diasporanearby
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: ${{ inputs.track || 'beta' }}
          status: completed
          inAppUpdatePriority: 5

      - name: Update Firestore system_stats/app_version Metadata
        if: ${{ !cancelled() }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/firebase-sa.json"
          npm --prefix functions ci --omit=dev
          node -e '
            const admin = require("./functions/node_modules/firebase-admin");
            admin.initializeApp({ projectId: "diaspora-nearby-a3dac" });
            const buildNum = Number(process.env.BUILD_NUMBER || 45);
            admin.firestore().doc("system_stats/app_version").set({
              latestVersion: "1.2.7",
              androidVersion: "1.2.7",
              iosVersion: "1.2.7",
              latestBuildNumber: buildNum,
              androidBuildNumber: buildNum,
              androidMinBuildNumber: 25,
              iosBuildNumber: buildNum,
              iosMinBuildNumber: 25,
              forceUpdate: false,
              androidUpdateUrl: "https://play.google.com/store/apps/details?id=com.diasporanearby.diasporanearby",
              androidApkUrl: admin.firestore.FieldValue.delete(),
              iosUpdateUrl: "https://testflight.apple.com/join/vB3XzPKg",
              releaseNotes: "Multi-language localization selector, borderless UI refinements, and diaspora community updates.",
              updatedAt: admin.firestore.FieldValue.serverTimestamp(),
            }, { merge: true }).then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(0); });
          ' || true
          rm -f /tmp/firebase-sa.json

      - name: Clean Up Ephemeral Signing Files
        if: always()
        run: |
          rm -f android/app/DiasporaNearby_release-keystore.jks android/key.properties
          rm -f android/app/google-services.json android/app/src/*/google-services.json
