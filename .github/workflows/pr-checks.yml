name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            build
            perf
            release
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: The subject must start with a capital letter.

      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release|dependabot)/.+ ]] && [[ "$BRANCH_NAME" != "dev" ]] && [[ "$BRANCH_NAME" != "staging" ]]; then
            echo "Branch name must follow feature/*, bugfix/*, hotfix/*, release/*, dependabot/*, dev, or staging."
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi
          echo "Branch name is valid: $BRANCH_NAME"

      - name: Check target branch
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          if [[ "$SOURCE_BRANCH" =~ ^(feature|bugfix)/.+ ]] && [ "$TARGET_BRANCH" != "dev" ]; then
            echo "Feature and bugfix branches must target dev."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" =~ ^dependabot/.+ ]] && [ "$TARGET_BRANCH" != "dev" ]; then
            echo "Dependabot branches must target dev."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" =~ ^release/.+ ]] && [ "$TARGET_BRANCH" != "staging" ]; then
            echo "Release branches must target staging."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" == "dev" ]] && [ "$TARGET_BRANCH" != "staging" ]; then
            echo "The dev branch must promote to staging."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" == "staging" ]] && [ "$TARGET_BRANCH" != "production" ]; then
            echo "The staging branch must promote to production."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" =~ ^hotfix/.+ ]] && [[ "$TARGET_BRANCH" != "staging" && "$TARGET_BRANCH" != "production" ]]; then
            echo "Hotfix branches must target staging or production."
            echo "Current target: $TARGET_BRANCH"
            exit 1
          fi

          echo "Target branch is correct: $TARGET_BRANCH"
