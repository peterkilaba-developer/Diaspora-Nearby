name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject must start with a capital letter.
      
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/.+ ]]; then
            echo "❌ Branch name must follow pattern: feature/*, bugfix/*, or hotfix/*"
            echo "   Current branch: $BRANCH_NAME"
            exit 1
          fi
          echo "✅ Branch name is valid: $BRANCH_NAME"
      
      - name: Check target branch
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          if [[ "$SOURCE_BRANCH" =~ ^hotfix/.+ ]] && [ "$TARGET_BRANCH" != "main" ]; then
            echo "❌ Hotfix branches must target 'main'"
            echo "   Current target: $TARGET_BRANCH"
            exit 1
          fi
          
          if [[ "$SOURCE_BRANCH" =~ ^(feature|bugfix)/.+ ]] && [ "$TARGET_BRANCH" != "develop" ]; then
            echo "❌ Feature/Bugfix branches must target 'develop'"
            echo "   Current target: $TARGET_BRANCH"
            exit 1
          fi
          
          echo "✅ Target branch is correct: $TARGET_BRANCH"
