    html,

      animation: spin 1s linear infinite;

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

        transform: rotate(360deg);
      }
    }

    .loading-text {

<body>
  <div id="loading-indicator" class="loading">
    <div class="loader"></div>
    <div class="loading-text">Diaspora Nearby</div>
  </div>

  <script>
    // Remove loading indicator once Flutter has rendered
    (function () {
      function removeLoader() {
        var loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.transition = 'opacity 0.3s ease';
          loader.style.opacity = '0';
          setTimeout(function () { loader.remove(); }, 350);
        }
      }

      // Watch for flutter-view element appearing in DOM
      var observer = new MutationObserver(function (mutations) {
        if (document.querySelector('flutter-view')) {
          observer.disconnect();
          // Small delay to ensure Flutter has painted
          setTimeout(removeLoader, 200);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback: remove after 8 seconds no matter what
      setTimeout(function () {
        observer.disconnect();
        removeLoader();
      }, 8000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ──────────────────────────────────────────────
    // 1. Register Firebase Messaging Service Worker
    // ──────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        scope: '/firebase-cloud-messaging-push-scope'
      })
        .then(function (reg) {
          console.log('FCM SW registered, scope:', reg.scope);
        })
        .catch(function (err) {
          console.warn('FCM SW registration failed:', err);
        });
    }

    // ──────────────────────────────────────────────
    // 2. Fix mobile keyboard gap on Flutter web
    // ──────────────────────────────────────────────
    // Use CSS 100dvh (dynamic viewport height) so the browser handles keyboard.
    // Only use JS as a safety net to force scroll to 0 and reset any stale heights.
    (function () {
      // Apply 100dvh via injected CSS — overrides the static 100% height
      var style = document.createElement('style');
      style.textContent = [
        'html, body, flutter-view, flt-glass-pane {',
        '  height: 100dvh !important;',
        '  max-height: 100dvh !important;',
        '  overflow: hidden !important;',
        '}'
      ].join('\n');
      document.head.appendChild(style);

      // Safety net: on any viewport change, force scroll to 0
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        });
        window.visualViewport.addEventListener('scroll', function () {
          window.scrollTo(0, 0);
        });
      }

      // Fallback: focusout — clear any stale inline styles
      document.addEventListener('focusout', function () {
        setTimeout(function () {
          document.body.style.height = '';
          var fv = document.querySelector('flutter-view');
          if (fv) fv.style.height = '';
          window.scrollTo(0, 0);
        }, 100);
      });
    })();
  </script>

  <script>
    // PWA Install Prompt handling
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar from appearing on mobile
      e.preventDefault();
      // Stash the event so it can be triggered later.
      deferredPrompt = e;
      // Optionally, send a message to Flutter that install is available
      console.log('PWA: Install prompt available');
      window.dispatchEvent(new Event('pwa-install-changed'));
    });

    window.addEventListener('appinstalled', (evt) => {
      console.log('PWA: App was installed');
    });

    // Global function for Flutter to call
    window.presentPWAInstall = async function () {
      if (!deferredPrompt) {
        console.log('PWA: Install prompt not stashed');
        return false;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`PWA: User response to the install prompt: ${outcome}`);
      deferredPrompt = null;
      // Dispatch event to update UI
      window.dispatchEvent(new Event('pwa-install-changed'));
      return outcome === 'accepted';
    };

    window.isInstallPromptAvailable = function () {
      return !!deferredPrompt;
    };

    window.isPwaStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };
  </script>
