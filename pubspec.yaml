name: diaspora_nearby
description: "The social network for connecting with your diaspora community nearby."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.2+6

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_crashlytics: ^5.0.6
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^3.2.1
  go_router: ^17.0.0
  lucide_icons: ^0.257.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.5.3
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  country_picker: ^2.0.27
  http: ^1.6.0
  uuid: ^4.5.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  image_picker: ^1.2.1
  geolocator: ^14.0.1
  geocoding: ^4.0.0  # For GPS reverse geocoding (lat/lng → city, state, country)
  permission_handler: ^12.0.1
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  audio_service: ^0.18.18

  sms_autofill: ^2.4.0
  device_region: ^1.4.0  # SIM/network country ISO (Android TelephonyManager, iOS CTTelephonyNetworkInfo) for onboarding country detection
  phone_numbers_parser: ^9.0.23  # Pure-Dart E.164 normalization (strips trunk prefix, validates NSN per country)
  video_player: ^2.10.1
  chewie: ^1.13.0
  record: ^6.1.2
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: ^32.1.19
  firebase_app_check: ^0.4.1+2
  flutter_slidable: ^4.0.3
  visibility_detector: ^0.4.0+2
  share_plus: ^12.0.1
  confetti: ^0.8.0
  just_audio_background: ^0.0.1-beta.17
  geoflutterfire_plus: ^0.0.34
  flutter_background_service: ^5.1.0
  device_info_plus: ^12.3.0
  firebase_performance: ^0.11.1+3
  universal_io: ^2.3.1
  receive_sharing_intent: ^1.8.1
  any_link_preview: ^3.0.3

  cross_file: any
  rxdart: ^0.28.0
  timeago: ^3.7.1
  flutter_cache_manager: any
  flutter_stripe: ^12.3.0
  google_mlkit_text_recognition: ^0.15.1
  web: any

dependency_overrides:
  # Upstream 6.3.1 throws while Flutter registers Dart plugins in the
  # background isolate. The local patch skips only that invalid registration.
  flutter_background_service_android:
    path: packages/flutter_background_service_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  build_runner: ^2.4.9
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  mockito: ^5.6.3
  network_image_mock: ^2.1.1
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.0.1
  integration_test:
    sdk: flutter


  baseflow_plugin_template: any
  permission_handler_platform_interface: any
  record_platform_interface: any
  riverpod: any
  shared_preferences_android: any
  shared_preferences_platform_interface: any
  meta: any
  share_plus_platform_interface: any
  path: any
  sqflite_common: any
  stream_transform: any
  flutter_web_plugins:
    sdk: flutter
  syncfusion_pdfviewer_platform_interface: any
  syncfusion_pdfviewer_web: any
  flutter_driver:
    sdk: flutter
  video_player_platform_interface: any
  _fe_analyzer_shared: any
  cloud_firestore_platform_interface: any
  firebase_auth_platform_interface: any
  firebase_storage_platform_interface: any
  test: 1.31.0


flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0A0A0A"
  image: "assets/icons/logo-sage-green-clean.png"
  android_12:
    image: "assets/icons/logo-sage-green-clean.png"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0A0A0A"
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/logo-sage-green-clean.png"
  image_path_ios: "assets/icons/logo-sage-green-clean.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo-sage-green-clean.png"
  min_sdk_android: 21

